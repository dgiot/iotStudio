<!DOCTYPE html>
<html lang="zh">
<head>

<title>DGAIOT 本体图谱 v3.0</title>
<script src="./vendor/echarts.min.js"></script>
<style>

#chart{width:100vw;height:100vh}
.title{position:fixed;top:12px;left:16px;color:#e8eef5;font-size:16px;font-weight:700;z-index:9}
.sub{position:fixed;top:34px;left:16px;color:#8899aa;font-size:12px;z-index:9}
.legend{position:fixed;bottom:14px;left:16px;color:#8899aa;font-size:12px;z-index:9}
</style>
</head>
<body>
<div class="title">DGAIOT 本体图谱 v3.0 <span style="color:#f5c542">示例数据</span></div>
<div class="sub">16 节点 · 13 边 — 示例，非真实项目</div>
<div class="legend">●项目(4) ●客户(3) ●产品(2) ●技术(4) ●类目(3) — 实线serves / 蓝uses_product / 绿uses_tech</div>
<div id="chart"></div>
<script>
const G = {"meta": {"name": "DGAIOT 本体图谱 v3.0", "method": "示例数据（占位，非真实项目）", "nodes": 16, "edges": 13, "generated": "2026-09-16"}, "nodes": [{"id": "prj:1", "label": "示例 · 车间设备物联", "type": "project"}, {"id": "prj:2", "label": "示例 · 能耗监测与优化", "type": "project"}, {"id": "prj:3", "label": "示例 · 设备预测性维护", "type": "project"}, {"id": "prj:4", "label": "示例 · 产线质量追溯", "type": "project"}, {"id": "cl:1", "label": "示例 · 离散制造企业", "type": "client"}, {"id": "cl:2", "label": "示例 · 流程工业企业", "type": "client"}, {"id": "cl:3", "label": "示例 · 园区运营方", "type": "client"}, {"id": "p:edge", "label": "边缘采集网关", "type": "product"}, {"id": "p:platform", "label": "物联网平台", "type": "product"}, {"id": "t:edge", "label": "边缘计算", "type": "tech"}, {"id": "t:tsdb", "label": "时序数据库", "type": "tech"}, {"id": "t:vision", "label": "机器视觉", "type": "tech"}, {"id": "t:ontology", "label": "本体建模", "type": "tech"}, {"id": "c:技术文档", "label": "技术文档", "type": "category"}, {"id": "c:方案模板", "label": "方案模板", "type": "category"}, {"id": "c:标准规范", "label": "标准规范", "type": "category"}], "edges": [{"from": "prj:1", "to": "cl:1", "type": "serves", "weight": 1.0}, {"from": "prj:2", "to": "cl:1", "type": "serves", "weight": 1.0}, {"from": "prj:3", "to": "cl:2", "type": "serves", "weight": 1.0}, {"from": "prj:4", "to": "cl:3", "type": "serves", "weight": 1.0}, {"from": "prj:1", "to": "p:edge", "type": "uses_product", "weight": 0.9}, {"from": "prj:2", "to": "p:platform", "type": "uses_product", "weight": 0.9}, {"from": "prj:3", "to": "p:edge", "type": "uses_product", "weight": 0.9}, {"from": "prj:4", "to": "p:platform", "type": "uses_product", "weight": 0.9}, {"from": "prj:1", "to": "t:edge", "type": "uses_tech", "weight": 0.8}, {"from": "prj:2", "to": "t:tsdb", "type": "uses_tech", "weight": 0.8}, {"from": "prj:3", "to": "t:ontology", "type": "uses_tech", "weight": 0.8}, {"from": "prj:4", "to": "t:vision", "type": "uses_tech", "weight": 0.8}, {"from": "prj:2", "to": "t:ontology", "type": "uses_tech", "weight": 0.8}]};
const COLORS = {
  project:'#409EFF', client:'#f5c542', product:'#67C23A',
  tech:'#e6a23c', category:'#8899aa'
};
const EC = {
  project:'#409EFF', client:'#f5c542', product:'#67C23A',
  tech:'#e6a23c', category:'#778899'
};
const chart = echarts.init(document.getElementById('chart'), 'dark');
chart.setOption({
  tooltip:{},
  legend:{show:false},
  series:[{
    type:'graph', layout:'force', roam:true,
    data: G.nodes.map(n=>({
      id:n.id, name:n.label,
      symbolSize: n.type==='project'?22 : n.type==='client'?20 : n.type==='category'?14 : 16,
      itemStyle:{color:COLORS[n.type]},
      category:n.type,
      label:{show: n.type!=='category', fontSize:10, color:'#cfd8e3'}
    })),
    links: G.edges.map(e=>({
      source:e.from, target:e.to,
      lineStyle:{
        color: e.type==='serves'?'#8a93a6' : e.type==='uses_product'?'#67C23A':'#409EFF',
        width: e.type==='serves'?1.2 : 1.8, curveness:0.12
      }
    })),
    force:{repulsion:260, edgeLength:[60,140], gravity:0.08},
    lineStyle:{opacity:0.55},
    emphasis:{focus:'adjacency', lineStyle:{width:3}}
  }]
});
</script>
</body>
</html>
