;//设置IoCommit测点数
[IoMonitor]
;IoCommit管理最大测点个数
IoCommitTagCount = 10000
;IOCommit 最多管理的IOMan个数
MaxIOCount = 10
[IoCommit]
;//缓存器中缓存点数量
CommitTagCount = 1000000
;//实时提交时间间隔
CommitRealSpan = 300
;//读取断缓时间间隔
CommitHisSpan = 500
;//是否指定每次提交测点数量
IsAssignCommitTagCountOnce = 1
;//每次提交实时数据点数，如果IsAssignCommitTagCountOnce值为0，则设置该项无效
CommitTagOnce = 15000
;//每次提交断缓文件点数
CommitTagOnceHis = 15000
;//调用历史接口提交历史数据时，停顿时间次数，如果设置5次，则第一次提交休眠5秒后提交1000点，第二次提交休眠4秒后提交2000点，第三次提交休眠3秒提交3000点，直到提交达到CommitTagOnceHis参数配置的点数..以此类推
HisTimesSleep = 5
;//IO提交超时时间 单位 ms
DataDelay = 5
;//IoCommit缓存队列数据达到一定数量时，是否需要存储到断缓文件中
IsSaveFile = 1
;//设置IoCommit断缓队列的最大存储量，一旦超过这个存储量，则需要根据IsSaveFile 参数判断是否把缓存中的数据暂时先缓存到断缓文件中
MaxTagValueCount = 100000
;执行次数
ExCount = 1