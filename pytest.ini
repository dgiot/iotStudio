[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
# test_integration.py 需要活服务器 — 默认排除（REQ-DEV-003 起用 marker，不再用 --ignore，
# 因为 --ignore 会让"显式点路径"也收不到该类用例）。手动/验收时：
#   脚本方式（可指定目标实例，含 1.5 真构建）:
#     API_BASE=http://127.0.0.1:8000/api python tests/test_integration.py
#   pytest 方式:
#     python -m pytest -m integration tests/test_integration.py -q
addopts = -m "not integration"
markers =
    integration: 需要活服务器的端到端用例（默认不跑；-m integration 显式跑）
